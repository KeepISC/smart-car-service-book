name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fictional-ci-only
      PGDATABASE: maintenance_test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize disposable database and run owner isolation tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_create_vehicles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610110001_maintenance_schedules.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/vehicles_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/maintenance_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_migration_setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610110002_firebase_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610120001_vehicle_maintenance_consistency.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_provisioning.sql
          SCSB_DISPOSABLE_DATABASE_TEST=true node scripts/test-provisioning-concurrency.mjs
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/vehicle_maintenance_consistency.sql
          SCSB_DISPOSABLE_DATABASE_TEST=true node scripts/test-maintenance-consistency-concurrency.mjs
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Europe/Lisbon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run scan:secrets
      - run: node scripts/check-publication-ignore.mjs
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
