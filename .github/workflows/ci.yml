name: Quality and security
on: [push, pull_request]
permissions:
  contents: read
jobs:
  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: fictional-ci-only
          POSTGRES_DB: maintenance_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: fictional-ci-only
      PGDATABASE: maintenance_test
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Initialize disposable database and run owner isolation tests
        run: |
          psql -v ON_ERROR_STOP=1 -f supabase/tests/bootstrap.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610100001_create_vehicles.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610110001_maintenance_schedules.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/vehicles_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/maintenance_rls.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_migration_setup.sql
          psql -v ON_ERROR_STOP=1 -f supabase/migrations/202610110002_firebase_identity.sql
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_provisioning.sql
          SCSB_DISPOSABLE_DATABASE_TEST=true node scripts/test-provisioning-concurrency.mjs
          psql -v ON_ERROR_STOP=1 -f supabase/tests/firebase_rls.sql
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run scan:secrets
      - run: node scripts/check-publication-ignore.mjs
      - run: npm audit --audit-level=high
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@dcedce43c6f43de0b836d1fe38946645c9c638dc # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
